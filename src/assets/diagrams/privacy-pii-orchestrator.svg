<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" height="auto"
     role="img" aria-labelledby="prv-title prv-desc">
  <title id="prv-title">Privacy / PII Request Orchestrator Architecture</title>
  <desc id="prv-desc">Left-to-right: User sends a privacy request to OneTrust (privacy management vendor), which fires a webhook to the Privacy Broker API. The broker forwards to the Compliance Request Orchestrator (primary actor). The orchestrator fans out via a Kafka request stream to 6 downstream services. Each service publishes its result to a Kafka result stream. The orchestrator aggregates and fires a fulfillment callback. State is stored in DynamoDB and a service registry. GDPR Article 15 and 17 compliance. Cross-cutting: CloudWatch, OpenTelemetry, IAM, IaC.</desc>
  <defs>
    <marker id="pa" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#9b9ba3"/></marker>
    <marker id="pa-p" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#7c5cff"/></marker>
    <marker id="pa-g" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#23d18b"/></marker>
  </defs>

  <!-- column headers -->
  <text x="50"  y="22" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#6b6b7a" letter-spacing="1">ENTRY</text>
  <text x="183" y="22" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#6b6b7a" letter-spacing="1">VENDOR</text>
  <text x="335" y="22" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#6b6b7a" letter-spacing="1">BROKER</text>
  <text x="492" y="22" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#6b6b7a" letter-spacing="1">ORCHESTRATOR</text>
  <text x="790" y="22" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#6b6b7a" letter-spacing="1">ASYNC BACKBONE</text>

  <!-- User -->
  <rect x="10" y="155" width="80" height="44" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="50" y="177" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ededf0">User</text>
  <text x="50" y="191" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#9b9ba3">privacy request</text>

  <!-- OneTrust (vendor) -->
  <rect x="108" y="120" width="150" height="80" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="183" y="152" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ededf0">OneTrust</text>
  <text x="183" y="168" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#9b9ba3">Privacy Management</text>
  <text x="183" y="183" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#9b9ba3">Vendor</text>

  <!-- Privacy Broker API -->
  <rect x="278" y="152" width="118" height="44" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="337" y="172" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#ededf0">Privacy Broker</text>
  <text x="337" y="187" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#9b9ba3">API</text>

  <!-- Compliance Request Orchestrator (purple) -->
  <rect x="416" y="58" width="160" height="72" rx="3" fill="none" stroke="#7c5cff" stroke-width="1.5"/>
  <text x="496" y="86" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7c5cff" font-weight="bold">Compliance Request</text>
  <text x="496" y="101" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7c5cff" font-weight="bold">Orchestrator</text>
  <text x="496" y="118" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#9b9ba3">subject-request-ID = idempotency key</text>

  <!-- State DB -->
  <rect x="416" y="146" width="160" height="32" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="496" y="166" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#ededf0">Request State DB (DynamoDB)</text>

  <!-- Service Registry -->
  <rect x="416" y="187" width="160" height="32" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="496" y="207" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#ededf0">Service Registry</text>

  <!-- S3 export -->
  <rect x="416" y="228" width="160" height="32" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="496" y="248" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#ededf0">S3 &#x2192; Access Data export</text>

  <!-- GDPR badge (green dashed) -->
  <rect x="418" y="268" width="156" height="22" rx="3" fill="none" stroke="#23d18b" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="496" y="283" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#23d18b">GDPR Art. 15 + 17 &middot; Audit trail</text>

  <!-- Kafka Request Stream -->
  <rect x="596" y="58" width="115" height="42" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="653" y="76" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#ededf0">Kafka</text>
  <text x="653" y="90" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#9b9ba3">User Request Stream</text>

  <!-- Kafka Result Stream -->
  <rect x="596" y="315" width="115" height="42" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="653" y="333" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#ededf0">Kafka</text>
  <text x="653" y="347" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#9b9ba3">User Result Stream</text>

  <!-- 6 downstream services -->
  <rect x="728" y="48"  width="148" height="32" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="802" y="68"  text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#ededf0">Comments Service</text>
  <rect x="728" y="88"  width="148" height="32" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="802" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#ededf0">Users / Profile Service</text>
  <rect x="728" y="128" width="148" height="32" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="802" y="148" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#ededf0">Saved Items Service</text>
  <rect x="728" y="168" width="148" height="32" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="802" y="188" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#ededf0">Brand-specific Services</text>
  <rect x="728" y="208" width="148" height="32" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="802" y="228" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#ededf0">Moderation Service</text>
  <rect x="728" y="248" width="148" height="32" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="802" y="268" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#ededf0">Media Service</text>

  <!-- ARROWS -->
  <!-- User → OneTrust -->
  <line x1="90" y1="177" x2="106" y2="177" stroke="#9b9ba3" stroke-width="1" marker-end="url(#pa)"/>
  <!-- OneTrust → Privacy Broker (webhook) -->
  <line x1="258" y1="162" x2="276" y2="162" stroke="#9b9ba3" stroke-width="1" marker-end="url(#pa)"/>
  <text x="267" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#9b9ba3">webhook</text>
  <!-- Privacy Broker → Orchestrator -->
  <polyline points="396,174 406,174 406,94 414,94" fill="none" stroke="#9b9ba3" stroke-width="1" marker-end="url(#pa)"/>
  <!-- Orchestrator → Privacy Broker (fulfillment callback, dashed) -->
  <polyline points="414,108 404,108 404,186 396,186" fill="none" stroke="#9b9ba3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#pa)"/>
  <text x="380" y="103" font-family="ui-monospace,monospace" font-size="7" fill="#9b9ba3">fulfillment</text>
  <text x="380" y="113" font-family="ui-monospace,monospace" font-size="7" fill="#9b9ba3">callback</text>
  <!-- Orchestrator → Request Stream (dashed) -->
  <line x1="576" y1="80" x2="594" y2="80" stroke="#7c5cff" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#pa-p)"/>
  <!-- Request Stream → services (bus + branches, dashed) -->
  <line x1="711" y1="79" x2="722" y2="79" stroke="#9b9ba3" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="722" y1="64" x2="722" y2="264" stroke="#9b9ba3" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="722" y1="64"  x2="726" y2="64"  stroke="#9b9ba3" stroke-width="1" marker-end="url(#pa)"/>
  <line x1="722" y1="104" x2="726" y2="104" stroke="#9b9ba3" stroke-width="1" marker-end="url(#pa)"/>
  <line x1="722" y1="144" x2="726" y2="144" stroke="#9b9ba3" stroke-width="1" marker-end="url(#pa)"/>
  <line x1="722" y1="184" x2="726" y2="184" stroke="#9b9ba3" stroke-width="1" marker-end="url(#pa)"/>
  <line x1="722" y1="224" x2="726" y2="224" stroke="#9b9ba3" stroke-width="1" marker-end="url(#pa)"/>
  <line x1="722" y1="264" x2="726" y2="264" stroke="#9b9ba3" stroke-width="1" marker-end="url(#pa)"/>
  <!-- Services → Result Stream (right bus, dashed) -->
  <line x1="876" y1="64"  x2="880" y2="64"  stroke="#9b9ba3" stroke-width="1"/>
  <line x1="876" y1="104" x2="880" y2="104" stroke="#9b9ba3" stroke-width="1"/>
  <line x1="876" y1="144" x2="880" y2="144" stroke="#9b9ba3" stroke-width="1"/>
  <line x1="876" y1="184" x2="880" y2="184" stroke="#9b9ba3" stroke-width="1"/>
  <line x1="876" y1="224" x2="880" y2="224" stroke="#9b9ba3" stroke-width="1"/>
  <line x1="876" y1="264" x2="880" y2="264" stroke="#9b9ba3" stroke-width="1"/>
  <line x1="880" y1="64" x2="880" y2="336" stroke="#9b9ba3" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="880" y1="336" x2="713" y2="336" stroke="#9b9ba3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#pa)"/>
  <!-- Result Stream → Orchestrator (feedback, dashed) -->
  <polyline points="596,341 412,341 412,278 414,278" fill="none" stroke="#9b9ba3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#pa)"/>
  <!-- Orchestrator internal connectors -->
  <line x1="496" y1="130" x2="496" y2="144" stroke="#1f1f24" stroke-width="1"/>
  <line x1="496" y1="178" x2="496" y2="187" stroke="#1f1f24" stroke-width="1"/>
  <line x1="496" y1="219" x2="496" y2="228" stroke="#1f1f24" stroke-width="1"/>

  <!-- Cross-cutting band -->
  <rect x="10" y="390" width="940" height="46" rx="3" fill="none" stroke="#1f1f24" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="480" y="408" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#6b6b7a" letter-spacing="1">CROSS-CUTTING</text>
  <text x="480" y="423" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#9b9ba3">CloudWatch &middot; OpenTelemetry &middot; IAM &middot; IaC (CDK / CloudFormation)</text>

  <!-- Legend -->
  <g transform="translate(800,330)">
    <text x="0" y="0" font-family="ui-monospace,monospace" font-size="8" fill="#6b6b7a" letter-spacing="1">LEGEND</text>
    <line x1="0" y1="13" x2="32" y2="13" stroke="#9b9ba3" stroke-width="1" marker-end="url(#pa)"/>
    <text x="36" y="17" font-family="ui-monospace,monospace" font-size="7" fill="#9b9ba3">sync HTTP</text>
    <line x1="0" y1="28" x2="32" y2="28" stroke="#9b9ba3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#pa)"/>
    <text x="36" y="32" font-family="ui-monospace,monospace" font-size="7" fill="#9b9ba3">async event</text>
    <rect x="0" y="40" width="8" height="8" fill="none" stroke="#7c5cff" stroke-width="1"/>
    <text x="12" y="48" font-family="ui-monospace,monospace" font-size="7" fill="#9b9ba3">primary actor</text>
    <rect x="0" y="56" width="8" height="8" fill="none" stroke="#23d18b" stroke-width="1"/>
    <text x="12" y="64" font-family="ui-monospace,monospace" font-size="7" fill="#9b9ba3">compliance</text>
  </g>
</svg>
