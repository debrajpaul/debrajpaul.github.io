<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="auto"
     role="img" aria-labelledby="fba-title fba-desc">
  <title id="fba-title">Full Budget App Architecture</title>
  <desc id="fba-desc">Client sends GraphQL requests through API Gateway to the GraphQL Lambda (Apollo Server, primary actor). The lambda reads and writes eight DynamoDB tables: Users, Transactions (with stream), Budgets, Recurring Transactions, Categories, Refresh Tokens, Savings Goals, and Sinking Funds. For statement uploads the lambda writes to an S3 bucket; an S3 PUT event triggers an SQS message; SQS triggers the txn-loaders Lambda which parses bank statements (HDFC, SBI, Axis) and writes normalised transactions to DynamoDB. The DynamoDB stream on the Transactions table triggers the tag-loaders Lambda which applies a deterministic NLP rule engine first, then falls back to Amazon Bedrock (Mistral) for low-confidence matches, and writes the result to the Categories table. AWS X-Ray, CloudWatch, and SSM Parameter Store provide observability and configuration.</desc>
  <defs>
    <marker id="fa" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#9b9ba3"/></marker>
    <marker id="fa-p" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#7c5cff"/></marker>
    <marker id="fa-g" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#23d18b"/></marker>
  </defs>

  <!-- column headers -->
  <text x="88"  y="22" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#6b6b7a" letter-spacing="1">CLIENT / ENTRY</text>
  <text x="480" y="22" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#6b6b7a" letter-spacing="1">COMPUTE</text>
  <text x="730" y="22" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#6b6b7a" letter-spacing="1">STORAGE / ASYNC</text>

  <!-- User / Client -->
  <rect x="14"  y="34" width="148" height="36" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="88"  y="56" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#ededf0">Client (web / mobile)</text>

  <!-- API Gateway -->
  <rect x="14"  y="88" width="148" height="36" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="88"  y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#ededf0">API Gateway</text>

  <!-- GraphQL Lambda (purple, primary) -->
  <rect x="200" y="60" width="290" height="64" rx="3" fill="none" stroke="#7c5cff" stroke-width="1.5"/>
  <text x="345" y="84"  text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#7c5cff" font-weight="bold">GraphQL Lambda</text>
  <text x="345" y="100" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#9b9ba3">Apollo Server 5 &middot; JWT &middot; X-Ray tracing</text>
  <text x="345" y="115" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#6b6b7a">7 queries &middot; 18+ mutations &middot; multi-tenant</text>

  <!-- DynamoDB group -->
  <rect x="200" y="158" width="285" height="226" rx="3" fill="none" stroke="#1f1f24" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="290" y="174" font-family="ui-monospace,monospace" font-size="8" fill="#9b9ba3" letter-spacing="1">DYNAMODB (8 tables &middot; on-demand &middot; tenantId PK)</text>
  <rect x="208" y="180" width="268" height="28" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="342" y="198" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#ededf0">Users</text>
  <rect x="208" y="216" width="268" height="28" rx="3" fill="none" stroke="#23d18b" stroke-width="1"/>
  <text x="310" y="234" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#ededf0">Transactions</text>
  <rect x="390" y="216" width="80" height="28" rx="3" fill="none" stroke="#23d18b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="430" y="234" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#23d18b">stream</text>
  <rect x="208" y="252" width="268" height="28" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="342" y="270" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#ededf0">Budgets</text>
  <rect x="208" y="288" width="268" height="28" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="342" y="306" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#ededf0">Recurring Transactions</text>
  <rect x="208" y="330" width="268" height="28" rx="3" fill="none" stroke="#23d18b" stroke-width="1"/>
  <text x="342" y="348" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#ededf0">Categories (output of tag-loaders)</text>
  <text x="342" y="374" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#6b6b7a">+ RefreshTokens &middot; SavingsGoals &middot; SinkingFunds</text>

  <!-- S3 Bucket -->
  <rect x="550" y="60" width="160" height="36" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="630" y="82" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#ededf0">S3 (statement uploads)</text>

  <!-- SQS -->
  <rect x="550" y="120" width="160" height="36" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="630" y="138" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#ededf0">SQS Queue</text>
  <text x="630" y="151" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#9b9ba3">batch 10 &middot; 300s visibility</text>

  <!-- txn-loaders Lambda -->
  <rect x="548" y="186" width="262" height="52" rx="3" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <text x="679" y="208" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ededf0">txn-loaders Lambda</text>
  <text x="679" y="224" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#9b9ba3">parse (HDFC / SBI / Axis) &middot; normalise &middot; write</text>

  <!-- tag-loaders Lambda (green) -->
  <rect x="548" y="280" width="262" height="60" rx="3" fill="none" stroke="#23d18b" stroke-width="1"/>
  <text x="679" y="302" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ededf0">tag-loaders Lambda</text>
  <text x="679" y="318" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#9b9ba3">NLP rule engine (deterministic first)</text>
  <text x="679" y="332" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#23d18b">Amazon Bedrock fallback (Mistral)</text>

  <!-- Bedrock box -->
  <rect x="548" y="378" width="262" height="36" rx="3" fill="none" stroke="#23d18b" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="679" y="396" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#23d18b">Amazon Bedrock (Mistral)</text>
  <text x="679" y="410" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#9b9ba3">low-confidence matches only</text>

  <!-- SSM Parameter Store -->
  <rect x="820" y="60" width="128" height="36" rx="3" fill="none" stroke="#1f1f24" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="884" y="79" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#9b9ba3">SSM Param Store</text>
  <text x="884" y="91" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#9b9ba3">JWT secret</text>

  <!-- Observability band -->
  <rect x="14" y="445" width="934" height="40" rx="3" fill="none" stroke="#1f1f24" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="481" y="462" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#6b6b7a" letter-spacing="1">OBSERVABILITY</text>
  <text x="481" y="477" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#9b9ba3">AWS X-Ray (10% sampling) &middot; CloudWatch alarms (errors / duration / throttle) &middot; Winston logs &middot; Prometheus /metrics</text>

  <!-- ARROWS -->
  <line x1="88" y1="70" x2="88" y2="86" stroke="#9b9ba3" stroke-width="1" marker-end="url(#fa)"/>
  <line x1="162" y1="106" x2="198" y2="92" stroke="#9b9ba3" stroke-width="1" marker-end="url(#fa)"/>
  <line x1="280" y1="124" x2="280" y2="156" stroke="#7c5cff" stroke-width="1" marker-end="url(#fa-p)"/>
  <line x1="310" y1="156" x2="310" y2="124" stroke="#9b9ba3" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#fa)"/>
  <line x1="490" y1="80" x2="548" y2="78" stroke="#9b9ba3" stroke-width="1" marker-end="url(#fa)"/>
  <text x="518" y="74" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#9b9ba3">upload</text>
  <line x1="630" y1="96" x2="630" y2="118" stroke="#9b9ba3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#fa)"/>
  <text x="643" y="112" font-family="ui-monospace,monospace" font-size="7" fill="#9b9ba3">S3 event</text>
  <line x1="630" y1="157" x2="630" y2="184" stroke="#9b9ba3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#fa)"/>
  <polyline points="548,218 490,218 490,230" fill="none" stroke="#9b9ba3" stroke-width="1" marker-end="url(#fa)"/>
  <text x="519" y="213" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#9b9ba3">write</text>
  <polyline points="476,230 476,310 546,310" fill="none" stroke="#9b9ba3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#fa)"/>
  <text x="490" y="282" font-family="ui-monospace,monospace" font-size="7" fill="#9b9ba3">DDB stream</text>
  <line x1="679" y1="340" x2="679" y2="376" stroke="#23d18b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#fa-g)"/>
  <text x="693" y="364" font-family="ui-monospace,monospace" font-size="7" fill="#23d18b">AI fallback</text>
  <polyline points="548,330 490,330 490,344" fill="none" stroke="#23d18b" stroke-width="1" marker-end="url(#fa-g)"/>
  <text x="519" y="326" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#23d18b">categorise</text>
  <line x1="820" y1="78" x2="492" y2="84" stroke="#1f1f24" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#fa)"/>

  <!-- Legend -->
  <g transform="translate(14,422)">
    <line x1="0" y1="8" x2="28" y2="8" stroke="#9b9ba3" stroke-width="1" marker-end="url(#fa)"/>
    <text x="32" y="12" font-family="ui-monospace,monospace" font-size="7" fill="#9b9ba3">sync</text>
    <line x1="75" y1="8" x2="103" y2="8" stroke="#9b9ba3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#fa)"/>
    <text x="107" y="12" font-family="ui-monospace,monospace" font-size="7" fill="#9b9ba3">async / event</text>
    <rect x="175" y="2" width="8" height="8" fill="none" stroke="#7c5cff" stroke-width="1"/>
    <text x="187" y="10" font-family="ui-monospace,monospace" font-size="7" fill="#9b9ba3">primary actor</text>
    <rect x="272" y="2" width="8" height="8" fill="none" stroke="#23d18b" stroke-width="1"/>
    <text x="284" y="10" font-family="ui-monospace,monospace" font-size="7" fill="#9b9ba3">AI / categorisation</text>
  </g>
</svg>
